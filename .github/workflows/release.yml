name: release

# A pushed tag v<major>.<minor>.<patch>, or this workflow run by hand from such a tag, builds the iOS
# app as that version and uploads it to TestFlight (release.md, ADR 0192). The job `release` runs in
# the environment `release`, whose deployment rule admits only tags matching v*, and reads the
# signing and upload keys from that environment alone. make release-check refuses a tag unless it is
# on main, landed by a pull request whose ci (ubuntu) and ci (macos) passed on the same tree.
# make release-ios signs and builds the app through Codemagic CLI tools, as Flutter's "Build and
# release an iOS app" shows; make release-upload publishes the ipa; make release-cleanup restores
# the login keychain and deletes the signing keychain. App Review stays the owner's, by hand.
#
# A pull request that changes what the release runs gets the job `dry-run`. It runs in no
# environment and reads no secret: it installs the locked tools and builds the app unsigned as 0.0.0.
# So it runs on pull requests from forks and Dependabot too.
#
# The same tag builds the Android App Bundle and uploads it to Google Play's internal track (ADR
# 0266). The job `release-android` runs in the same environment and gates the tag with the same
# make release-check. make release-android builds the bundle signed with the upload key, read from
# the environment's secrets, and make release-android-upload runs gradle-play-publisher as the
# service account below, through the credentials file google-github-actions/auth writes from this
# job's OIDC token. No Google key is stored. The project number and the workload identity pool and
# provider are the environment's variables. Promotion to another track stays the owner's, by hand.
# The job `dry-run-android` reads no secret: it builds the bundle signed with a key made for the
# run, and lists the upload's tasks.
#
# Dependabot moves the `uses:` pins, which are ci.yml's, and tools/release/uv.lock. The runner label
# and the Xcode in DEVELOPER_DIR, one of the image's versioned paths, are moved by the PM with
# ci.yml's labels; "Set up job" logs the image each run resolved to.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Makefile'
      - 'scripts/release-ios.ts'
      - 'scripts/release-android.ts'
      - 'app/android/settings.gradle.kts'
      - 'app/android/app/build.gradle.kts'
      - 'scripts/grants.txt'
      - 'scripts/process.ts'
      - 'scripts/run.sh'
      - 'tools/release/**'

permissions: read-all

# One group per pull request and one per tag. A new push to a pull request cancels its dry run in
# progress. A release in progress is never cancelled, but a newer run of the same tag queued behind
# it cancels any older pending one, as GitHub cancels pending runs in every group. Releases of two
# tags run side by side.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dry-run:
    name: release dry run
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # scripts/run.sh runs scripts/release-ios.ts, a Deno program.
      - &deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: scripts/.deno-version
      # The program runs Codemagic CLI tools through uv at the releases tools/release/uv.lock pins.
      - &uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          enable-cache: false
      # The dry run signs nothing, so this only shows that the lock installs.
      - run: uv sync --project tools/release --locked
      - &flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: app/pubspec.yaml
          cache: true
      - &rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rust-src-dir: engine
          cache-workspaces: |
            engine
            app/rust
      # With TAG unset, make release-ios builds unsigned and reads no key.
      - run: make release-ios
        env:
          RUN: ${{ github.run_number }}
          TMPDIR: ${{ runner.temp }}

  release:
    name: release iOS
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    environment: release
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      TAG: ${{ github.ref_name }}
    steps:
      # make release-check reads main and the tag from the clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - *deno
      - run: make release-check
        env:
          GH_TOKEN: ${{ github.token }}
      - *uv
      - *flutter
      - *rust
      # The build number is the run number plus one, so it rises with every run.
      - run: make release-ios
        env:
          RUN: ${{ github.run_number }}
          TMPDIR: ${{ runner.temp }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IOS_DISTRIBUTION_CERT_PRIVATE_KEY: ${{ secrets.IOS_DISTRIBUTION_CERT_PRIVATE_KEY }}
      - run: make release-upload
        env:
          TMPDIR: ${{ runner.temp }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      # The program removes the key files at the end of each step; this restores the login keychain,
      # as the doc requires after keychain initialize, deletes the signing keychain and removes what a
      # killed step left.
      - if: always()
        run: make release-cleanup
        env:
          TMPDIR: ${{ runner.temp }}

  dry-run-android:
    name: release dry run android
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *deno
      # keytool and Gradle run on the JDK ci.yml's build-apk builds with.
      - &java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - *flutter
      - *rust
      # With TAG unset, make release-android shows a build with no key failing, then signs with a
      # key made for the run; make release-android-upload lists the upload's tasks and runs none.
      - run: make release-android
        env:
          RUN: ${{ github.run_number }}
          TMPDIR: ${{ runner.temp }}
      - run: make release-android-upload

  release-android:
    name: release Android
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 60
    # id-token: write lets google-github-actions/auth request this job's OIDC token; the rest is what
    # make release-check reads through the GitHub API.
    permissions:
      contents: read
      pull-requests: read
      checks: read
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # make release-check reads main and the tag from the clone. The checkout comes before auth,
      # which writes its credentials file into the workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - *deno
      - run: make release-check
        env:
          GH_TOKEN: ${{ github.token }}
      - *java
      - *flutter
      - *rust
      # The version code is the run number plus one, as the iOS build number is.
      - run: make release-android
        env:
          RUN: ${{ github.run_number }}
          TMPDIR: ${{ runner.temp }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      # Workload Identity Federation through a service account, as the action's README shows: it
      # writes an external-account credentials file and sets GOOGLE_APPLICATION_CREDENTIALS to it.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ vars.GCP_WORKLOAD_IDENTITY_POOL }}/providers/${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-actions-release@knowno-515411.iam.gserviceaccount.com
      - run: make release-android-upload
