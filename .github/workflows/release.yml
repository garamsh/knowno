name: release

# A pushed tag v<major>.<minor>.<patch>, or this workflow run by hand from such a tag, builds the iOS
# app as that version and uploads it to TestFlight (release.md, ADR 0192). The job `release` runs in
# the environment `release`, whose deployment rule admits only tags matching v*, and reads the
# signing and upload keys from that environment alone. make release-check refuses a tag unless it is
# on main, landed by a pull request whose ci (ubuntu) and ci (macos) passed on the same tree.
# make release-ios signs and builds the app through Codemagic CLI tools, as Flutter's "Build and
# release an iOS app" shows; make release-upload publishes the ipa; make release-cleanup restores
# the login keychain and deletes the signing keychain. App Review stays the owner's, by hand.
#
# A pull request that changes what the release runs gets the job `dry-run`. It runs in no
# environment and reads no secret: it installs the locked tools and builds the app unsigned as 0.0.0.
# So it runs on pull requests from forks and Dependabot too.
#
# Dependabot moves the `uses:` pins, which are ci.yml's, and tools/release/uv.lock. The runner label
# and the Xcode in DEVELOPER_DIR, one of the image's versioned paths, are moved by the PM with
# ci.yml's labels; "Set up job" logs the image each run resolved to.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Makefile'
      - 'scripts/release-ios.ts'
      - 'scripts/grants.txt'
      - 'scripts/process.ts'
      - 'scripts/run.sh'
      - 'tools/release/**'

permissions: read-all

# One group per pull request and one per tag. A new push to a pull request cancels its dry run in
# progress. A release in progress is never cancelled, but a newer run of the same tag queued behind
# it cancels any older pending one, as GitHub cancels pending runs in every group. Releases of two
# tags run side by side.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dry-run:
    name: release dry run
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # scripts/run.sh runs scripts/release-ios.ts, a Deno program.
      - &deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: scripts/.deno-version
      # The program runs Codemagic CLI tools through uv at the releases tools/release/uv.lock pins.
      - &uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          enable-cache: false
      # The dry run signs nothing, so this only shows that the lock installs.
      - run: uv sync --project tools/release --locked
      - &flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: app/pubspec.yaml
          cache: true
      - &rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rust-src-dir: engine
          cache-workspaces: |
            engine
            app/rust
      # With TAG unset, make release-ios builds unsigned and reads no key.
      - run: make release-ios
        env:
          RUN: ${{ github.run_number }}
          TMPDIR: ${{ runner.temp }}

  release:
    name: release iOS
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    environment: release
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      TAG: ${{ github.ref_name }}
    steps:
      # make release-check reads main and the tag from the clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - *deno
      - run: make release-check
        env:
          GH_TOKEN: ${{ github.token }}
      - *uv
      - *flutter
      - *rust
      # The build number is the run number plus one, so it rises with every run.
      - run: make release-ios
        env:
          RUN: ${{ github.run_number }}
          TMPDIR: ${{ runner.temp }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IOS_DISTRIBUTION_CERT_PRIVATE_KEY: ${{ secrets.IOS_DISTRIBUTION_CERT_PRIVATE_KEY }}
      - run: make release-upload
        env:
          TMPDIR: ${{ runner.temp }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      # The program removes the key files at the end of each step; this restores the login keychain,
      # as the doc requires after keychain initialize, deletes the signing keychain and removes what a
      # killed step left.
      - if: always()
        run: make release-cleanup
        env:
          TMPDIR: ${{ runner.temp }}
