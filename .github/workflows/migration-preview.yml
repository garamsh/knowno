name: migration preview

# On a pull request that touches supabase/migrations/, make preview-migrations applies main's
# migrations to a throwaway local stack, loads supabase/preview-seed.sql, applies the pull request's
# migrations and writes what changed, which this job posts as its summary on the pull request
# (server.md). It is not a required check: it fails when a migration fails on the seeded data, and
# its report is for the reviewer. It reads only the repository, so it holds no secret.
#
# Dependabot moves the `uses:` pins. The runner label and the CLI and Deno versions are those of
# ci.yml's ubuntu jobs, and move in the same pull request as theirs.
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'

permissions: read-all

jobs:
  preview:
    name: make preview-migrations
    runs-on: ubuntu-24.04
    steps:
      # The script reads main as the merge commit's first parent, as scripts/check-migration-order.ts does.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.120.0
      # scripts/run.sh runs the preview, a Deno program, which writes only under TMPDIR.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7
      - run: make preview-migrations PREVIEW="$RUNNER_TEMP/migration-preview"
        env:
          TMPDIR: ${{ runner.temp }}
      - run: cat "$RUNNER_TEMP/migration-preview.md" >> "$GITHUB_STEP_SUMMARY"
