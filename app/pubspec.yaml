name: knowno
description: "knowno memorization app client."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  unorm_dart: ^0.3.3
  uuid: ^4.6.0
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0
  freezed_annotation: ^3.1.0
  supabase_flutter: ^2.18.3
  google_sign_in: ^7.2.0
  crypto: ^3.0.8
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  image: ^4.12.0
  http: ^1.6.0
  connectivity_plus: ^7.3.2
  # Lucide's 2 px, round-capped icons (docs/architecture/design/brand.md).
  lucide_icons_flutter: 4.0.1
  url_launcher: 6.3.3
  package_info_plus: 10.2.2
  record: 7.1.2
  just_audio: 0.10.6
  file_picker: 13.3.0
  archive: ^4.6.0
  xml: ^7.1.0
  sign_in_with_apple: ^8.2.0
  flutter_timezone: 5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  freezed: ^4.0.3
  google_sign_in_platform_interface: ^3.1.0
  plugin_platform_interface: ^2.1.8
  shared_preferences_platform_interface: ^2.4.2
  sign_in_with_apple_platform_interface: ^2.0.0
  # The launcher icons and the native splash are generated from assets/brand/
  # by these, pinned exactly since their output is committed; scripts/check-generated.ts
  # reruns both.
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.8

# The sqlite3 package's build hook downloads a prebuilt SQLite from GitHub releases unless
# told to compile one; this compiles the committed amalgamation instead, so no build fetches
# anything and every build ships the same SQLite (ADR 0220).
hooks:
  user_defines:
    sqlite3:
      source: source
      path: third_party/sqlite/sqlite3.c

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Pretendard 1.3.9, under the SIL Open Font License in assets/fonts/OFL.txt:
  # public/static/*.otf and LICENSE.txt of Pretendard-1.3.9.zip from
  # github.com/orioncactus/pretendard/releases/tag/v1.3.9 (SHA-256
  # 04be351a74d6bf7d60c480a3087e51d185485d35a52023142af1df19eb8c428a), each
  # byte-identical to the npm package pretendard@1.3.9 (registry integrity
  # sha512-PaQAADyLY5v4kYFwkpSJHbSSYIkiriY/1xXw75TKoZ9UQQqeU+tvP05yTdZAWibiIYoo8ZKtRv8PM7w0IaywSw==).
  # Jua, under the SIL Open Font License in assets/fonts/OFL-Jua.txt:
  # ofl/jua/Jua-Regular.ttf and OFL.txt of github.com/google/fonts at commit
  # 6c1dbe27dcf7d817d4b62cec033ba77fa8e2a5ec (SHA-256
  # 769677aef240bfc3b9965f2b50748075bff885e6c6992fc591a3fb268279f898).
  # Google Sans Medium, the label font of Google's sign-in button, under the SIL
  # Open Font License in assets/fonts/OFL-GoogleSans.txt, which is OFL.txt of
  # ofl/googlesans/ in github.com/google/fonts at commit
  # d4eb04601981780781306966afb88e876652bab4: a subset of that commit's
  # GoogleSans[GRAD,opsz,wght].ttf (SHA-256
  # d0a87d835a944b8b40d0e82a5651bb59ab97b936a2aeed5946eb57e7b2a3a90a), which
  # tools/fonts/google_sans.py writes.
  # Google's "G" mark, from its Sign in with Google assets (docs/architecture/design/theme.md).
  # The brand's stacked lockup and circled mark (docs/architecture/design/brand.md).
  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/OFL-Jua.txt
    - assets/fonts/OFL-GoogleSans.txt
    - assets/google/
    - assets/brand/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800
    - family: Jua
      fonts:
        - asset: assets/fonts/Jua-Regular.ttf
    # What draws a character Jua lacks: one face, so a style at Jua's own
    # weight takes it whole. Flutter thickens Jua itself at a heavier weight.
    - family: PretendardExtraBold
      fonts:
        - asset: assets/fonts/Pretendard-ExtraBold.otf
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# The launcher icons, from the 1024 px sources make brand writes; iOS 18 and
# later draws the dark one in dark mode, and Android 8 and later the adaptive
# icon, the mark over cobalt.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon/app-icon-light-1024.png
  image_path_ios_dark_transparent: assets/brand/icon/app-icon-dark-1024.png
  remove_alpha_ios: true
  background_color_ios: "#2547D0"
  adaptive_icon_background: "#2547D0"
  adaptive_icon_foreground: assets/brand/icon/app-icon-foreground-1024.png

# The native splash, on the screens' own grounds: the mark alone on the light
# ground, the mark on its cream circle on the dark ground.
flutter_native_splash:
  color: "#EEF3FF"
  image: assets/brand/splash/splash-light.png
  color_dark: "#111A2E"
  image_dark: assets/brand/splash/splash-dark.png
  android_12:
    color: "#EEF3FF"
    image: assets/brand/splash/android12-light.png
    color_dark: "#111A2E"
    image_dark: assets/brand/splash/android12-dark.png
  web: false
